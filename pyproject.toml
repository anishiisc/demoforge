[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demoforge"
version = "0.1.0"
description = "Multi-agent system that turns a natural-language use case into a runnable mock demo"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "streamlit>=1.35.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.22.0",
    "rich>=13.7.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
demoforge = "demoforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/demoforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["demoforge"]
